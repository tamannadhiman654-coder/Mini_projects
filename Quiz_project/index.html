
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #c026d3);
        }

        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        #container {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: #6b21a8;
            font-size: 14px;
            font-weight: bold;
        }

        .progress {
            height: 8px;
            background: #e9d5ff;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #c026d3);
            transition: width 0.3s ease;
        }

        #question {
            font-size: 22px;
            line-height: 1.5;
            color: #1f2937;
            margin-bottom: 22px;
        }

        #answers {
            display: grid;
            gap: 12px;
        }

        .answer-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            color: #374151;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer-btn:hover:not(:disabled) {
            border-color: #9333ea;
            background: #faf5ff;
        }

        .answer-btn:focus-visible,
        #btn:focus-visible {
            outline: 3px solid #f59e0b;
            outline-offset: 3px;
        }

        .answer-btn.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .answer-btn.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        #feedback {
            min-height: 25px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        #btn {
            margin-top: 22px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            color: white;
            background: linear-gradient(90deg, #7c3aed, #c026d3);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        #btn:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        #btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #result {
            text-align: center;
            padding: 15px 0;
        }

        #result h2 {
            color: #7c3aed;
            font-size: 28px;
            margin-bottom: 15px;
        }

        #result p {
            color: #4b5563;
            line-height: 1.8;
            font-size: 17px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 30px;
            }

            #container {
                padding: 22px;
            }

            #question {
                font-size: 19px;
            }

            .answer-btn {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <h1>🧠 Quiz Time</h1>

    <main id="container">

        <div id="quiz-screen">
            <div class="top-bar">
                <span id="question-count">Question 1 of 14</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="progress">
                <div id="progress-bar"></div>
            </div>

            <h2 id="question">Welcome to the Quiz!</h2>

            <div id="answers"></div>

            <p id="feedback" aria-live="polite">
                Click Start Quiz to begin!
            </p>

            <button id="btn">Start Quiz</button>
        </div>

        <div id="result" class="hidden" aria-live="polite">
            <h2>🏆 Quiz Completed!</h2>
            <p id="final-score"></p>
            <p id="message"></p>
            <button id="restart-btn" class="hidden">
                Play Again
            </button>
        </div>

    </main>

    <script>
        const questions = [
            {
                question: "What is the capital of India?",
                answers: ["Mumbai", "New Delhi", "Kolkata", "Chennai"],
                correct: 1
            },
            {
                question: "Which language is used to style web pages?",
                answers: ["HTML", "Python", "CSS", "Java"],
                correct: 2
            },
            {
                question: "What does HTML stand for?",
                answers: [
                    "Hyper Text Markup Language",
                    "High Tech Modern Language",
                    "Hyper Transfer Machine Language",
                    "Home Tool Markup Language"
                ],
                correct: 0
            },
              {
        question: "Which keyword is used to create a class in JavaScript?",
        answers:["object",
         "struct",
         "class",
        "create",],
  
        correct: 2
    },
    {
        question: "What does NaN stand for?",
        answers:["Not a Number",
         "No assigned Name",
         "New and Null",
    "Negative Number",],
        
        correct: 0
    },
    {
        question: "Which method selects an element by its ID?",
        answers:["document.query()",
         "document.getElementById()",
         "document.getClass()",
        "document.selectId()"],
   
        correct: 1
    },
    {
        question: "What is the result of Boolean(0)?",
     answers:[  "true",
        "0",
         "false",
         "undefined"],
        correct: 2
    },
    {
        question: "Which array method creates a new array by transforming elements?",
    answers: [   "map()",
        "push()",
        "pop()",
    "findIndex()"],
        correct:0
    },
    {
        question: "What does the === operator compare?",
      answers: [  "Only values",
         "Only data types",
      "Only object references",
       "Values and types without type coercion"],
        correct: 3
    },
    {
        question: "Which keyword is used to handle errors with exceptions?",
     answers: [ "check/catch",
      "try/catch",
       "error/handle",
   "if/else"],
        correct: 1
    },
    {
        question: "What does Promise.resolve() return?",
      answers:[ "A resolved Promise",
    "A normal array",
    "A callback function",
  "An HTML element"],
        correct: 0
    },
    {
        question: "Which syntax creates an arrow function?",
      answers:[  "function => ()",
        "function() ->",
        "() => {}",
      "=> function()"],
        correct: 2
    },
            {
                question: "Which keyword declares a constant in JavaScript?",
                answers: ["var", "let", "const", "static"],
                correct: 2
            },
            {
                question: "Which planet is known as the Red Planet?",
                answers: ["Earth", "Mars", "Jupiter", "Venus"],
                correct: 1
            }
        ];

        const questionElement = document.getElementById("question");
        const answersElement = document.getElementById("answers");
        const button = document.getElementById("btn");
        const feedback = document.getElementById("feedback");
        const scoreElement = document.getElementById("score");
        const countElement = document.getElementById("question-count");
        const progressBar = document.getElementById("progress-bar");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result");
        const finalScore = document.getElementById("final-score");
        const message = document.getElementById("message");
        const restartButton = document.getElementById("restart-btn");

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let started = false;

        button.addEventListener("click", () => {
            if (!started) {
                started = true;
                button.textContent = "Next Question";
                showQuestion();
            } else if (answered) {
                currentQuestion++;

                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }
        });

        restartButton.addEventListener("click", () => {
            currentQuestion = 0;
            score = 0;
            answered = false;
            started = true;

            resultScreen.classList.add("hidden");
            quizScreen.classList.remove("hidden");
            button.textContent = "Next Question";

            showQuestion();
        });

        function showQuestion() {
            answered = false;

            const current = questions[currentQuestion];

            questionElement.textContent = current.question;
            countElement.textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            scoreElement.textContent = `Score: ${score}`;
            progressBar.style.width =
                `${(currentQuestion / questions.length) * 100}%`;

            feedback.textContent = "";
            answersElement.replaceChildren();
            button.disabled = true;

            current.answers.forEach((answer, index) => {
                const answerButton = document.createElement("button");

                answerButton.className = "answer-btn";
                answerButton.textContent =
                    `${String.fromCharCode(65 + index)}. ${answer}`;

                answerButton.addEventListener("click", () => {
                    checkAnswer(index, answerButton);
                });

                answersElement.appendChild(answerButton);
            });
        }

        function checkAnswer(selectedIndex, selectedButton) {
            if (answered) return;

            answered = true;

            const current = questions[currentQuestion];
            const allButtons = answersElement.querySelectorAll("button");

            allButtons.forEach((answerButton, index) => {
                answerButton.disabled = true;

                if (index === current.correct) {
                    answerButton.classList.add("correct");
                }
            });

            if (selectedIndex === current.correct) {
                score++;
                feedback.textContent = "✅ Correct answer! Well done!";
                feedback.style.color = "#15803d";
            } else {
                selectedButton.classList.add("wrong");
                feedback.textContent =
                    `❌ Incorrect! Correct answer: ${current.answers[current.correct]}`;
                feedback.style.color = "#dc2626";
            }

            scoreElement.textContent = `Score: ${score}`;
            progressBar.style.width =
                `${((currentQuestion + 1) / questions.length) * 100}%`;

            button.disabled = false;

            button.textContent =
                currentQuestion === questions.length - 1
                    ? "See Results"
                    : "Next Question";
        }

        function showResult() {
            quizScreen.classList.add("hidden");
            resultScreen.classList.remove("hidden");

            const percentage = Math.round(
                (score / questions.length) * 100
            );

            finalScore.textContent =
                `You scored ${score} out of ${questions.length} (${percentage}%).`;

            if (percentage === 100) {
                message.textContent = "🌟 Perfect score! Outstanding!";
            } else if (percentage >= 60) {
                message.textContent = "🎉 Great job! Keep learning!";
            } else {
                message.textContent = "💪 Keep practicing. You can do it!";
            }

            restartButton.classList.remove("hidden");
        }

    </script>

</body>
</html>
